syntax = "proto3";
package order.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/SanishKumar/go-microservices/order/pb";

message Order {
    message OrderProduct {
        string id = 1;
        string name = 2;
        string description = 3;
        // Unit price captured when the order was placed, not the current catalog price.
        double price = 4;
        uint32 quantity = 5;
    }

    string id = 1;
    google.protobuf.Timestamp created_at = 2;
    string account_id = 3;
    double total_price = 4;
    repeated OrderProduct products = 5;
}

message PostOrderRequest {
    message OrderProduct {
        string product_id = 1;
        uint32 quantity = 2;
    }

    string account_id = 1;
    repeated OrderProduct products = 2;
    // Requests carrying a key that was already used return the original order
    // instead of creating a second one, which makes PostOrder safe to retry.
    string idempotency_key = 3;
}

message PostOrderResponse {
    Order order = 1;
}

message GetOrdersForAccountRequest {
    string account_id = 1;
}

message GetOrdersForAccountResponse {
    repeated Order orders = 1;
}

service OrderService {
    rpc PostOrder (PostOrderRequest) returns (PostOrderResponse);
    rpc GetOrdersForAccount (GetOrdersForAccountRequest) returns (GetOrdersForAccountResponse);
}
