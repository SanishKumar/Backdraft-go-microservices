name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go tests and policy gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOFLAGS: -mod=vendor
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          files=$(gofmt -l $(git ls-files '*.go' ':!:vendor/**'))
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go vet ./...
      - name: Unit tests with race detector
        run: go test -race -short -count=1 -timeout=5m ./...
      - name: Live failure and recovery over real gRPC
        run: go test -v -count=1 -timeout=3m ./internal/lab
      - name: Enforce the hardened example policy
        run: go run ./cmd/backdraft check examples/hardened.policy.json

  web:
    name: UI build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  compose:
    name: Docker Compose with real databases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Prepare Elasticsearch host
        run: sudo sysctl -w vm.max_map_count=262144
      - run: docker compose config --quiet
      - run: docker compose up -d --build
      - name: Exercise the UI, agents, database writes, and policy updates
        run: python3 scripts/smoke.py --gateway http://127.0.0.1:8000/graphql --wait 180
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans
